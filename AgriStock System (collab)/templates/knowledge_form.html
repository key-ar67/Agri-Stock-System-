{% extends "base.html" %}{% block title %}Knowledge article{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">LEARNING CENTER</span><h1>{{ 'Edit article' if item else 'Add knowledge article' }}</h1><p>Share accurate, practical agricultural information.</p></div><a class="btn secondary" href="{{ url_for('knowledge') }}">← Back</a></div>
<div class="panel form-panel"><form method="post" class="form-grid"><label>Module type<select name="module_type">{% for t in ['Seed Guide','Planting Calendar','Do and Don’t','Pest and Disease'] %}<option {% if item and item.module_type==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select></label><label>Title<input name="title" required value="{{ item.title if item else '' }}"></label><label>Crop / plant<input name="crop" value="{{ item.crop if item else '' }}"></label><label>Season / month<input name="season" value="{{ item.season if item else '' }}"></label><label class="span-2">Symptoms (for pest/disease)<textarea name="symptoms" rows="2">{{ item.symptoms if item else '' }}</textarea></label><label class="span-2">Guide / information<textarea name="content" rows="5" required>{{ item.content if item else '' }}</textarea></label><label class="span-2">Prevention / best practices<textarea name="prevention" rows="3">{{ item.prevention if item else '' }}</textarea></label><div class="form-actions"><button class="btn primary">Save article</button><a class="btn secondary" href="{{ url_for('knowledge') }}">Cancel</a></div></form></div>{% endblock %}
