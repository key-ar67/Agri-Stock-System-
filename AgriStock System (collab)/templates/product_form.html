{% extends "base.html" %}{% block title %}Product{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">INVENTORY / PRODUCTS</span><h1>{{ 'Edit product' if item else 'Add product' }}</h1><p>Product master data is used by every inventory batch.</p></div><a class="btn secondary" href="{{ url_for('products') }}">← Back</a></div>
<div class="panel form-panel"><form method="post" class="form-grid"><label>Product name<input name="product_name" required value="{{ item.product_name if item else '' }}"></label><label>Category<input name="category" placeholder="e.g. Seeds, Fertilizer" value="{{ item.category if item else '' }}"></label><label>Unit<input name="unit" value="{{ item.unit if item else 'pcs' }}" required></label><label>Reorder level<input type="number" min="0" name="reorder_level" value="{{ item.reorder_level if item else 10 }}"></label><label class="span-2">Description<textarea name="description" rows="3">{{ item.description if item else '' }}</textarea></label><div class="form-actions"><button class="btn primary">Save product</button><a class="btn secondary" href="{{ url_for('products') }}">Cancel</a></div></form></div>{% endblock %}
