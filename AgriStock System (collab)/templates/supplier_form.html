{% extends "base.html" %}{% block title %}Supplier{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">MASTERLIST / SUPPLIERS</span><h1>{{ 'Edit supplier' if item else 'Add supplier' }}</h1><p>Keep supplier contact information updated.</p></div><a class="btn secondary" href="{{ url_for('suppliers') }}">← Back</a></div>
<div class="panel form-panel"><form method="post" class="form-grid"><label>Supplier name<input name="supplier_name" required value="{{ item.supplier_name if item else '' }}"></label><label>Contact number<input name="contact" value="{{ item.contact if item else '' }}"></label><label>Email address<input type="email" name="email" value="{{ item.email if item else '' }}"></label><label class="span-2">Address<textarea name="address" rows="3">{{ item.address if item else '' }}</textarea></label><div class="form-actions"><button class="btn primary">Save supplier</button><a class="btn secondary" href="{{ url_for('suppliers') }}">Cancel</a></div></form></div>{% endblock %}
